name: Publish app
on:
  push:
    branches-ignore: [gh-pages]
    paths-ignore: ['.github/**', 'DEPLOYMENT.md']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish (empty uses the default branch)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          persist-credentials: false
      - name: Checkout shared publishing tools
        uses: actions/checkout@v4
        with:
          repository: disconcision/furl-next
          ref: furl
          path: automation
          sparse-checkout: .github/pages
          persist-credentials: false
      - name: Install the classic OCaml toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y opam bubblewrap libgmp-dev pkg-config
          opam init --bare --disable-sandboxing -y
          opam repository add archive git+https://github.com/ocaml/opam-repository-archive --all-switches
          opam switch create classic ocaml-base-compiler.4.08.1 --repositories=default,archive -y
      - name: Build classic Furl
        working-directory: source
        env:
          OPAMYES: '1'
        run: |
          eval "$(opam env --switch=classic)"
          opam switch import opam.export
          make release
          mkdir ../build
          cp -R _build/default/src/web/www/. ../build/
      - name: Checkout combined site
        uses: actions/checkout@v4
        with:
          repository: disconcision/furl-next
          ref: gh-pages
          path: site
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
      - name: Publish this app without replacing other builds
        run: |
          python3 automation/.github/pages/publish.py \
            --site site --build build --app furl \
            --branch "$SOURCE_BRANCH" --default main --classic \
            --revision "$(git -C source rev-parse HEAD)" --push
